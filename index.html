<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#000;
  min-height:100vh;overflow:hidden;
  font-family:'Nunito',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.stars{position:fixed;inset:0;pointer-events:none;z-index:1;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) infinite ease-in-out var(--dl,0s);}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
#fw-canvas{position:fixed;inset:0;pointer-events:none;z-index:2;}

/* ---- TITLE BIG ---- */
.content{position:relative;z-index:20;display:flex;flex-direction:column;align-items:center;width:100%;padding:0 10px;}
.title-wrap{text-align:center;margin-bottom:8px;animation:fadeInDown .9s ease;width:100%;}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-30px);}to{opacity:1;transform:translateY(0);}}

.title-line1{
  font-family:'Pacifico',cursive;
  font-size:clamp(2.8rem, 8vw, 5rem);
  display:block;line-height:1.05;
  background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe100,#00ff88,#00cfff,#a855f7,#ff0080);
  background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:rainbowShift 2s linear infinite;
  filter:drop-shadow(0 0 12px rgba(255,255,255,.35));
  letter-spacing:2px;
}
.title-line2{
  font-family:'Nunito',sans-serif;
  font-size:clamp(1.5rem, 5vw, 2.8rem);
  font-weight:900;
  color:#fff;display:block;margin-top:6px;
  text-shadow:0 0 18px #e0aaff,0 0 40px #c77dff,0 0 80px #9d4edd;
  animation:glowPulse 2s infinite alternate;
  letter-spacing:1px;
  line-height:1.15;
}
@keyframes rainbowShift{0%{background-position:0%;}100%{background-position:200%;}}
@keyframes glowPulse{from{text-shadow:0 0 10px #c77dff,0 0 25px #9d4edd;}to{text-shadow:0 0 24px #e0aaff,0 0 50px #c77dff,0 0 100px #9d4edd;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}

/* ---- CAKE ---- */
.cake-scene{position:relative;width:250px;display:flex;flex-direction:column;align-items:center;animation:fadeInUp 1.2s ease;margin-top:4px;}
.flame-wrap{position:relative;width:24px;height:38px;margin:0 auto -5px;z-index:6;transition:opacity .4s,transform .5s;}
.flame-outer{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:38px;background:radial-gradient(ellipse at 50% 100%,#fff700 0%,#ff9f43 40%,#ff4757 80%,transparent 100%);border-radius:50% 50% 35% 35%;animation:flicker .12s infinite alternate ease-in-out;box-shadow:0 0 18px 4px rgba(255,180,50,.7),0 0 35px 8px rgba(255,100,30,.4);}
.flame-inner{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:10px;height:16px;background:radial-gradient(ellipse at 50% 100%,#fff 0%,#fff176 60%,transparent 100%);border-radius:50% 50% 35% 35%;animation:flicker .1s infinite alternate-reverse ease-in-out;}
@keyframes flicker{0%{transform:translateX(-50%) scaleX(1) rotate(-2deg);}100%{transform:translateX(-50%) scaleX(.88) rotate(2.5deg);}}
.flame-wrap.blown{opacity:0;transform:translateX(20px) scaleY(.2);}
.smoke{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:6px;height:0;border-radius:50%;opacity:0;}
.smoke.show{animation:smokeRise 2s ease-out forwards;}
@keyframes smokeRise{0%{height:0;opacity:.7;transform:translateX(-50%) scaleX(1);}50%{height:40px;opacity:.4;transform:translateX(-46%) scaleX(1.5);background:rgba(200,200,200,.5);}100%{height:70px;opacity:0;transform:translateX(-44%) scaleX(2.5);}}

.candle-num{font-family:'Pacifico',cursive;font-size:4.5rem;line-height:1;background:linear-gradient(180deg,#ffe066 0%,#ff9f43 50%,#ff6bcb 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(255,200,80,.9));position:relative;z-index:5;margin-bottom:-8px;animation:bounceSpin 3s ease-in-out infinite;}
@keyframes bounceSpin{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.08) rotate(2deg);}}

.tier{position:relative;border-radius:14px 14px 6px 6px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tier::before{content:'';position:absolute;top:0;left:0;right:0;height:18px;background:rgba(255,255,255,.45);border-radius:14px 14px 0 0;}
.tier-top{width:100px;height:48px;background:linear-gradient(180deg,#f9ca24 0%,#e67e22 100%);box-shadow:0 6px 24px rgba(230,126,34,.5),inset 0 -4px 0 rgba(0,0,0,.12);margin-bottom:-3px;z-index:3;animation:tierShake 4s ease-in-out infinite;}
.tier-mid{width:155px;height:58px;background:linear-gradient(180deg,#fd79a8 0%,#e84393 100%);box-shadow:0 8px 28px rgba(232,67,147,.5),inset 0 -4px 0 rgba(0,0,0,.12);margin-bottom:-3px;z-index:2;animation:tierShake 4s ease-in-out .3s infinite;}
.tier-bot{width:210px;height:70px;background:linear-gradient(180deg,#6c5ce7 0%,#4a00e0 100%);box-shadow:0 10px 32px rgba(74,0,224,.6),inset 0 -4px 0 rgba(0,0,0,.15);margin-bottom:-3px;z-index:1;animation:tierShake 4s ease-in-out .6s infinite;}
@keyframes tierShake{0%,100%{transform:translateX(0);}40%{transform:translateX(-2px);}60%{transform:translateX(2px);}}

.drips{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-evenly;pointer-events:none;}
.drip{width:10px;height:20px;background:rgba(255,255,255,.55);border-radius:0 0 8px 8px;}
.sprinkle{position:absolute;width:7px;height:3px;border-radius:2px;opacity:.9;}
.age-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:radial-gradient(circle at 35% 35%,#fff176,#ffd700);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Pacifico',cursive;font-size:1.5rem;color:#5c2d00;box-shadow:0 0 0 3px #fff,0 0 12px rgba(255,215,0,.8);z-index:10;animation:badgePop 2s ease-in-out infinite;}
@keyframes badgePop{0%,100%{box-shadow:0 0 0 3px #fff,0 0 12px rgba(255,215,0,.8);}50%{box-shadow:0 0 0 5px #fff,0 0 30px rgba(255,215,0,1),0 0 60px rgba(255,200,0,.5);}}

.plate{width:250px;height:16px;background:linear-gradient(90deg,#ffd700,#ffe259,#ffd700);border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.4);margin-top:2px;}
.glow-ring{width:200px;height:20px;background:radial-gradient(ellipse,rgba(180,100,255,.5) 0%,transparent 70%);margin-top:4px;animation:ringPulse 1.5s infinite alternate;}
@keyframes ringPulse{from{opacity:.4;transform:scaleX(.85);}to{opacity:1;transform:scaleX(1.15);}}

/* ---- BALLOONS ---- */
.balloon{position:fixed;bottom:-140px;width:70px;height:90px;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;animation:riseUp var(--dur,7s) linear var(--delay,0s) infinite;z-index:5;pointer-events:none;}
.balloon::after{content:'';position:absolute;bottom:-22px;left:50%;width:1.5px;height:22px;background:rgba(255,255,255,.3);}
.balloon::before{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:8px;height:6px;background:inherit;clip-path:polygon(0 0,100% 0,50% 100%);filter:brightness(.7);}
.b1{left:3%;background:radial-gradient(circle at 30% 30%,#ff7675,#c0392b);--dur:6s;--delay:0s;}
.b2{left:14%;background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3);--dur:8s;--delay:1.3s;}
.b3{left:25%;background:radial-gradient(circle at 30% 30%,#55efc4,#00b894);--dur:7s;--delay:2.7s;}
.b4{left:38%;background:radial-gradient(circle at 30% 30%,#fdcb6e,#e17055);--dur:9s;--delay:.6s;}
.b5{left:52%;background:radial-gradient(circle at 30% 30%,#ff6bc1,#e84393);--dur:6.5s;--delay:1.9s;}
.b6{left:64%;background:radial-gradient(circle at 30% 30%,#a29bfe,#6c5ce7);--dur:7.5s;--delay:3.2s;}
.b7{left:76%;background:radial-gradient(circle at 30% 30%,#ffeaa7,#fdcb6e);--dur:8.5s;--delay:.9s;}
.b8{left:88%;background:radial-gradient(circle at 30% 30%,#81ecec,#00cec9);--dur:6.8s;--delay:4s;}
@keyframes riseUp{0%{transform:translateY(0) rotate(-4deg);opacity:0;}5%{opacity:1;}50%{transform:translateY(-55vh) rotate(4deg);}95%{opacity:1;}100%{transform:translateY(-115vh) rotate(-6deg);opacity:0;}}

.streamer{position:fixed;top:-60px;border-radius:4px;animation:streamerFall var(--dur,5s) linear var(--delay,0s) infinite;pointer-events:none;z-index:6;}
@keyframes streamerFall{0%{transform:translateY(0) rotate3d(1,1,1,0deg);opacity:0;}5%{opacity:1;}100%{transform:translateY(115vh) rotate3d(1,1,1,1440deg);opacity:0;}}

.confetti-piece{position:fixed;top:-20px;width:var(--w,10px);height:var(--h,10px);border-radius:var(--br,2px);background:var(--bg,#ff6bc1);animation:confettiFall var(--dur,5s) linear var(--delay,0s) infinite;pointer-events:none;z-index:7;opacity:0;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:0;}5%{opacity:1;}100%{transform:translateY(110vh) rotate(720deg) translateX(var(--drift,30px));opacity:0;}}

.emoji-fly{position:fixed;bottom:-60px;font-size:var(--fs,2rem);animation:emojiFly var(--dur,8s) ease-in-out var(--delay,0s) infinite;pointer-events:none;z-index:8;}
@keyframes emojiFly{0%{transform:translateY(0) rotate(0deg);opacity:0;}8%{opacity:1;}50%{transform:translateY(-60vh) rotate(20deg);}92%{opacity:1;}100%{transform:translateY(-120vh) rotate(-10deg);opacity:0;}}

/* ---- BUTTONS ---- */
.btn-row{display:flex;gap:9px;margin-top:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.btn{padding:9px 16px;border-radius:50px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:900;transition:transform .15s,box-shadow .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.btn:active{transform:scale(.95);}
.btn-music{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;box-shadow:0 0 18px rgba(108,92,231,.6);}
.btn-music:hover{box-shadow:0 0 28px rgba(108,92,231,.9);transform:scale(1.05);}
.btn-blow{background:linear-gradient(135deg,#fd79a8,#e84393);color:#fff;box-shadow:0 0 18px rgba(232,67,147,.6);}
.btn-blow:hover{box-shadow:0 0 28px rgba(232,67,147,.9);transform:scale(1.05);}
.btn-blow:disabled{opacity:.5;cursor:default;transform:none;}
.btn-snap{background:linear-gradient(135deg,#f9ca24,#f0932b);color:#fff;box-shadow:0 0 18px rgba(249,202,36,.6);}
.btn-snap:hover{box-shadow:0 0 28px rgba(249,202,36,.9);transform:scale(1.05);}
.btn-disco{background:linear-gradient(135deg,#00cec9,#00b894);color:#fff;box-shadow:0 0 18px rgba(0,206,201,.6);}
.btn-disco:hover{box-shadow:0 0 28px rgba(0,206,201,.9);transform:scale(1.05);}

/* ---- WISH MODAL ---- */
.wish-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;}
.wish-overlay.show{opacity:1;pointer-events:all;}
.wish-box{background:linear-gradient(135deg,#1a003a,#0d0020);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:28px 24px;text-align:center;max-width:320px;width:90%;box-shadow:0 0 60px rgba(180,100,255,.6);animation:wishPop .5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes wishPop{from{transform:scale(.5) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0deg);opacity:1;}}
.wish-emoji{font-size:3.5rem;display:block;margin-bottom:10px;animation:wishBounce 1s ease-in-out infinite;}
@keyframes wishBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.wish-title{font-family:'Pacifico',cursive;font-size:1.7rem;color:#ffe066;text-shadow:0 0 20px #ffd700;margin-bottom:8px;}
.wish-sub{color:rgba(255,230,255,.8);font-size:.95rem;font-weight:700;line-height:1.5;margin-bottom:18px;}
.wish-close{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:50px;padding:10px 28px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;cursor:pointer;}
.wish-close:hover{transform:scale(1.05);}

/* ---- SCORE ---- */
.score-wrap{display:flex;gap:12px;margin-top:8px;align-items:center;}
.score-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:5px 12px;text-align:center;}
.score-label{font-size:.65rem;color:rgba(255,230,255,.6);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.score-num{font-family:'Pacifico',cursive;font-size:1.2rem;color:#ffe066;text-shadow:0 0 8px #ffd700;}

.disco-light{position:fixed;width:200px;height:200px;border-radius:50%;pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:0;animation:discoMove var(--dur,3s) ease-in-out var(--delay,0s) infinite;}
@keyframes discoMove{0%{opacity:0;transform:translate(0,0) scale(.5);}20%{opacity:.35;}50%{opacity:.5;transform:translate(var(--tx,50px),var(--ty,-80px)) scale(1);}80%{opacity:.3;}100%{opacity:0;transform:translate(var(--tx2,-30px),var(--ty2,60px)) scale(.6);}}
body.disco-mode{animation:discoBg .3s steps(1) infinite;}
@keyframes discoBg{0%{background:#000;}16%{background:#0d001a;}33%{background:#001a0d;}50%{background:#1a0d00;}66%{background:#00001a;}83%{background:#1a000d;}100%{background:#000;}}
@keyframes shake{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg) scale(1.1);}75%{transform:rotate(8deg) scale(1.1);}}
.shaking{animation:shake .12s infinite;display:inline-block;}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<canvas id="bg-canvas"></canvas>
<canvas id="fw-canvas"></canvas>

<div class="disco-light" style="background:radial-gradient(circle,#ff0080,transparent);--dur:2.8s;--delay:0s;--tx:120px;--ty:-100px;--tx2:-80px;--ty2:60px;"></div>
<div class="disco-light" style="background:radial-gradient(circle,#00cfff,transparent);--dur:3.2s;--delay:.8s;--tx:-150px;--ty:-80px;--tx2:60px;--ty2:40px;"></div>
<div class="disco-light" style="background:radial-gradient(circle,#ffe100,transparent);--dur:2.5s;--delay:1.5s;--tx:80px;--ty:60px;--tx2:-100px;--ty2:-90px;"></div>
<div class="disco-light" style="background:radial-gradient(circle,#a855f7,transparent);--dur:3.5s;--delay:.4s;--tx:-60px;--ty:80px;--tx2:130px;--ty2:-50px;"></div>

<div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div>
<div class="balloon b4"></div><div class="balloon b5"></div><div class="balloon b6"></div>
<div class="balloon b7"></div><div class="balloon b8"></div>
<div id="confetti-container"></div>
<div id="emoji-container"></div>

<div class="content">
  <div class="title-wrap">
    <span class="title-line1">¡Feliz Cumpleaños!</span>
    <span class="title-line2">Thiago José Carreño Cuello</span>
  </div>

  <div class="cake-scene">
    <div class="flame-wrap" id="flame-wrap">
      <div class="smoke" id="smoke"></div>
      <div class="flame-outer"></div>
      <div class="flame-inner"></div>
    </div>
    <div class="candle-num">8</div>
    <div class="tier tier-top">
      <div class="drips"><div class="drip"></div><div class="drip"></div><div class="drip"></div></div>
      <div class="age-badge">8</div>
    </div>
    <div class="tier tier-mid" id="mid-tier">
      <div class="drips"><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div></div>
    </div>
    <div class="tier tier-bot" id="bot-tier">
      <div class="drips"><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div></div>
    </div>
    <div class="plate"></div>
    <div class="glow-ring"></div>
  </div>

  <div class="score-wrap">
    <div class="score-box"><div class="score-label">🎆 Fuegos</div><div class="score-num" id="fw-count">0</div></div>
    <div class="score-box"><div class="score-label">🎊 Confetti</div><div class="score-num" id="conf-count">0</div></div>
    <div class="score-box"><div class="score-label">🕯️ Sopladas</div><div class="score-num" id="blow-count">0</div></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-music" id="btn-music" onclick="toggleMusic()">🎵 <span id="music-label">Música</span></button>
    <button class="btn btn-blow" id="btn-blow" onclick="blowCandle()">💨 Soplar</button>
    <button class="btn btn-snap" onclick="megaFirework()">🎆 ¡BOOM!</button>
    <button class="btn btn-disco" id="btn-disco" onclick="toggleDisco()">🪩 Disco</button>
  </div>
</div>

<div class="wish-overlay" id="wish-overlay">
  <div class="wish-box">
    <span class="wish-emoji" id="wish-emoji">🌟</span>
    <div class="wish-title" id="wish-title">¡Pide un deseo!</div>
    <div class="wish-sub" id="wish-sub">Thiago, tus 8 años son mágicos. ¡Que todos tus sueños se cumplan! 🎂</div>
    <button class="wish-close" onclick="closeWish()">¡Lo pedí! ✨</button>
  </div>
</div>

<script>
// Stars
const starsEl=document.getElementById('stars');
for(let i=0;i<150;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;--dl:-${(Math.random()*4).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

// BG canvas
const bgCanvas=document.getElementById('bg-canvas');
const bgCtx=bgCanvas.getContext('2d');
function resizeBg(){bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;}
resizeBg();window.addEventListener('resize',resizeBg);
let bgAngle=0,discoActive=false;
function drawBg(){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  const cx=bgCanvas.width/2,cy=bgCanvas.height/2;
  bgCtx.save();bgCtx.translate(cx,cy);bgCtx.rotate(bgAngle);
  const colors=['#ff008044','#ff8c0033','#ffe10033','#00ff8833','#00cfff33','#a855f733'];
  for(let i=0;i<6;i++){
    bgCtx.save();bgCtx.rotate((Math.PI*2/6)*i);
    const g=bgCtx.createLinearGradient(0,0,0,-Math.max(bgCanvas.width,bgCanvas.height));
    g.addColorStop(0,colors[i]);g.addColorStop(1,'transparent');
    bgCtx.fillStyle=g;
    bgCtx.beginPath();bgCtx.moveTo(0,0);
    bgCtx.arc(0,0,Math.max(bgCanvas.width,bgCanvas.height)*1.2,-Math.PI/8,Math.PI/8);
    bgCtx.closePath();bgCtx.fill();bgCtx.restore();
  }
  bgCtx.restore();
  bgAngle+=discoActive?.025:.003;
  requestAnimationFrame(drawBg);
}
drawBg();

// Confetti
const confColors=['#ff6bc1','#ffe066','#74b9ff','#55efc4','#fd79a8','#a29bfe','#ff7675','#fdcb6e','#00cec9','#ff0080'];
const confContainer=document.getElementById('confetti-container');
let confCount=0;
function spawnConfetti(n,cx){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    const isRect=Math.random()>.5;
    const left=cx!=null?(cx-10+Math.random()*20):Math.random()*100;
    p.style.cssText=`left:${left}%;--w:${Math.random()*9+5}px;--h:${Math.random()*15+5}px;--br:${isRect?'2px':'50%'};--bg:${confColors[Math.floor(Math.random()*confColors.length)]};--dur:${(Math.random()*3+3).toFixed(1)}s;--delay:0s;--drift:${(Math.random()*100-50).toFixed(0)}px;`;
    confContainer.appendChild(p);
    confCount++;
    document.getElementById('conf-count').textContent=confCount;
    setTimeout(()=>p.remove(),6000);
  }
}
for(let i=0;i<60;i++){
  const p=document.createElement('div');p.className='confetti-piece';
  const isRect=Math.random()>.5;
  p.style.cssText=`left:${Math.random()*100}%;--w:${Math.random()*9+5}px;--h:${Math.random()*15+5}px;--br:${isRect?'2px':'50%'};--bg:${confColors[Math.floor(Math.random()*confColors.length)]};--dur:${(Math.random()*4+4).toFixed(1)}s;--delay:-${(Math.random()*6).toFixed(1)}s;--drift:${(Math.random()*100-50).toFixed(0)}px;`;
  confContainer.appendChild(p);
}

// Streamers
const SCOLS=['#ffbe0b','#fb5607','#ff006e','#8338ec','#3a86c8','#00f5d4','#ff0080'];
for(let i=0;i<10;i++){
  const s=document.createElement('div');s.className='streamer';

// Sprinkles
function addSprinkles(el,n){
  const colors=['#fff','#ff6bc1','#74b9ff','#55efc4','#ffe066','#fd79a8','#00cec9'];
  const w=el.offsetWidth,h=el.offsetHeight;
  for(let i=0;i<n;i++){

    sp.style.cssText=`left:${10+Math.random()*(w-20)}px;top:${20+Math.random()*(h-30)}px;background:${colors[Math.floor(Math.random()*colors.length)]};transform:rotate(${Math.random()*180}deg);`;

// Fireworks
const fwCanvas=document.getElementById('fw-canvas');
const ctx=fwCanvas.getContext('2d');
function resizeFw(){fwCanvas.width=window.innerWidth;fwCanvas.height=window.innerHeight;}
resizeFw();window.addEventListener('resize',resizeFw);
const FW_COLORS=['#ff6bc1','#ffe066','#74b9ff','#ff7675','#a29bfe','#55efc4','#fd79a8','#fdcb6e','#00cec9','#e17055','#ff0080','#00ff88'];
let fwCount=0;
class Particle{
  constructor(x,y,color,speed){
    this.x=x;this.y=y;
    const angle=Math.random()*Math.PI*2;
    const spd=speed||Math.random()*4+1.5;
    this.vx=Math.cos(angle)*spd;this.vy=Math.sin(angle)*spd;
    this.alpha=1;this.color=color;this.size=Math.random()*3+1.5;
    this.decay=Math.random()*.015+.012;this.gravity=.07;
    this.trail=[];
  }
  update(){
    this.trail.push({x:this.x,y:this.y,a:this.alpha});
    if(this.trail.length>6) this.trail.shift();
    this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.vx*=.98;this.alpha-=this.decay;
  }
  draw(){
    this.trail.forEach((t,i)=>{
      ctx.save();ctx.globalAlpha=t.a*(i/this.trail.length)*.3;
      ctx.fillStyle=this.color;ctx.beginPath();
      ctx.arc(t.x,t.y,this.size*.7,0,Math.PI*2);ctx.fill();ctx.restore();
    });
    ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;
    ctx.shadowBlur=8;ctx.shadowColor=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}
let particles=[];
function launchFirework(x,y){
  if(!x) x=Math.random()*fwCanvas.width;
  if(!y) y=Math.random()*fwCanvas.height*.5;
  const color=FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  for(let i=0;i<80;i++) particles.push(new Particle(x,y,color));
  for(let i=0;i<20;i++){
    const angle=(Math.PI*2/20)*i;
    const p=new Particle(x,y,FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)],2);
    p.vx=Math.cos(angle)*3;p.vy=Math.sin(angle)*3;particles.push(p);
  }
  fwCount++;
  document.getElementById('fw-count').textContent=fwCount;
  if(Math.random()>.5) spawnConfetti(8,x/fwCanvas.width*100);
}
function megaFirework(){
  for(let i=0;i<6;i++) setTimeout(()=>launchFirework(),i*120);
  spawnConfetti(30);
  const el=document.querySelector('.cake-scene');
  el.style.transform='scale(1.08)';setTimeout(()=>el.style.transform='',300);
}
function fwLoop(){
  ctx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  particles=particles.filter(p=>p.alpha>0);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(fwLoop);
}
fwLoop();
launchFirework();setTimeout(launchFirework,800);
setInterval(launchFirework,2500);

// Music
let audioCtx=null,musicPlaying=false,musicNodes=[],musicTimeout=null;
const SONG=[[261.6,1],[261.6,.5],[293.7,1.5],[261.6,1.5],[349.2,1.5],[329.6,3],[261.6,1],[261.6,.5],[293.7,1.5],[261.6,1.5],[392.0,1.5],[349.2,3],[261.6,1],[261.6,.5],[523.3,1.5],[440.0,1.5],[349.2,1.5],[329.6,1.5],[293.7,3],[466.2,1],[466.2,.5],[440.0,1.5],[349.2,1.5],[392.0,1.5],[349.2,3]];
function playNote(actx,freq,start,dur,vol,type='triangle'){
  const osc=actx.createOscillator();const g=actx.createGain();
  const delay=actx.createDelay(.3);const dg=actx.createGain();dg.gain.value=.15;
  osc.connect(g);g.connect(actx.destination);g.connect(delay);delay.connect(dg);dg.connect(actx.destination);
  osc.type=type;osc.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.04);
  g.gain.setValueAtTime(vol,start+dur-.05);g.gain.linearRampToValueAtTime(0,start+dur);
  osc.start(start);osc.stop(start+dur+.05);musicNodes.push(osc);
}
function startMusic(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  musicNodes=[];
  const BPM=90,beat=60/BPM;let t=audioCtx.currentTime+.1;
  const total=SONG.reduce((s,[,d])=>s+d,0)*beat;
  SONG.forEach(([freq,dur])=>{
    playNote(audioCtx,freq,t,dur*beat*.85,.18,'triangle');
    playNote(audioCtx,freq*1.5,t,dur*beat*.85,.05,'sine');
    playNote(audioCtx,freq*.5,t,dur*beat*.85,.06,'square');
    t+=dur*beat;
  });
  musicTimeout=setTimeout(()=>{if(musicPlaying) startMusic();},total*1000+300);
}
function stopMusic(){clearTimeout(musicTimeout);musicNodes.forEach(n=>{try{n.stop();}catch(e){}});musicNodes=[];}
function toggleMusic(){
  const btn=document.getElementById('btn-music');const lbl=document.getElementById('music-label');
  musicPlaying=!musicPlaying;
  if(musicPlaying){startMusic();lbl.textContent='Pausar';btn.style.background='linear-gradient(135deg,#00b894,#55efc4)';}
  else{stopMusic();lbl.textContent='Música';btn.style.background='linear-gradient(135deg,#6c5ce7,#a29bfe)';}
}

// Disco
let discoInterval=null,discoOn=false;
function toggleDisco(){
  discoOn=!discoOn;const btn=document.getElementById('btn-disco');
  if(discoOn){
    document.body.classList.add('disco-mode');
    document.querySelectorAll('.disco-light').forEach(d=>d.style.opacity='1');
    btn.style.background='linear-gradient(135deg,#ff0080,#ff8c00)';btn.textContent='🪩 Disco ON';
    discoInterval=setInterval(()=>{launchFirework();spawnConfetti(5);},600);discoActive=true;
  } else {
    document.body.classList.remove('disco-mode');
    document.querySelectorAll('.disco-light').forEach(d=>d.style.opacity='0');
    btn.style.background='linear-gradient(135deg,#00cec9,#00b894)';btn.textContent='🪩 Disco';
    clearInterval(discoInterval);discoActive=false;
  }
}

// Blow candle
let candleBlown=false,blowCountNum=0;
const WISHES=[
  {e:'🌟',t:'¡Pide un deseo!',s:'Thiago, que todos tus sueños se hagan realidad este año mágico. ¡8 años de pura alegría! 🎂'},
  {e:'🦄',t:'¡Deseo pedido!',s:'¡Eres increíble, Thiago! Que este año esté lleno de aventuras y sorpresas. 🌈'},
  {e:'🚀',t:'¡Al infinito!',s:'8 años y ya conquistando el mundo, Thiago. ¡El cielo es el límite! ✨'},
  {e:'🎮',t:'¡Nivel desbloqueado!',s:'¡Thiago subió de nivel! Año 8 desbloqueado. ¡Que empiece la aventura! 🏆'},
];
function blowCandle(){
  if(candleBlown) return;candleBlown=true;
  const btn=document.getElementById('btn-blow');btn.disabled=true;
  btn.innerHTML='💨 <span class="shaking">🌬️</span>';
  setTimeout(()=>{
    document.getElementById('flame-wrap').classList.add('blown');
    document.getElementById('smoke').classList.add('show');
    blowCountNum++;document.getElementById('blow-count').textContent=blowCountNum;
    for(let i=0;i<8;i++) setTimeout(()=>launchFirework(),i*200);
    spawnConfetti(40);
    const w=WISHES[blowCountNum%WISHES.length];
    document.getElementById('wish-emoji').textContent=w.e;
    document.getElementById('wish-title').textContent=w.t;
    document.getElementById('wish-sub').textContent=w.s;
    setTimeout(()=>document.getElementById('wish-overlay').classList.add('show'),800);
    setTimeout(()=>{
      const nb=document.createElement('button');nb.className='btn btn-blow';nb.id='btn-blow';
      nb.innerHTML='🕯️ Volver a encender';nb.onclick=relightCandle;
      btn.parentNode.replaceChild(nb,btn);
    },5000);
  },400);
}
function closeWish(){document.getElementById('wish-overlay').classList.remove('show');}
function relightCandle(){
  candleBlown=false;
  document.getElementById('flame-wrap').classList.remove('blown');
  document.getElementById('smoke').classList.remove('show');
  const old=document.querySelector('#btn-blow');
  if(old){
    const nb=document.createElement('button');nb.className='btn btn-blow';nb.id='btn-blow';
    nb.innerHTML='💨 Soplar';nb.onclick=blowCandle;old.parentNode.replaceChild(nb,old);
  }
}

document.addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('.wish-box')) return;
  launchFirework(e.clientX,e.clientY);
  spawnConfetti(5,e.clientX/window.innerWidth*100);
});
